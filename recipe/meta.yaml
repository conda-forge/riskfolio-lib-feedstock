{% set name = "Riskfolio-Lib" %}
{% set version = "7.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') | lower }}-{{ version }}.tar.gz
  sha256: 73ab9400691e0ca4258ba1b3d4939018c67809955504807b0559904405246bdf
  patches:
    - devendor-eigen-spectra.patch

build:
  number: 0
  skip: true  # [win or py<39]
  script:
    - {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy >=1.26.4                         # [build_platform != target_platform]
    - pybind11                               # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - numpy >=1.26.4
    - pybind11 >=2.13.6
    - scipy >=1.16.1  # [py>310]
    - scipy  # [py<311]
    - setuptools >=68.1.0
    - wheel
    - eigen
    - spectra-cpp
  run:
    - python
    - arch-py >=7.2
    - astropy-base >=6.1.3
    - clarabel >=0.11.1
    - cvxpy >=1.6.6
    - matplotlib-base >=3.9.2
    - networkx >=3.4.2
    - numpy >=1.26.4
    - pandas >=2.2.2
    - scikit-learn >=1.3.0
    - scipy >=1.16.1
    - scs >=3.2.7
    - statsmodels >=0.14.5
    - vectorbt >=0.28.0
    - xlsxwriter >=3.2.2

test:
  requires:
    - python
  imports:
    - riskfolio

about:
  home: https://github.com/dcajasn/Riskfolio-Lib
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Portfolio Optimization and Quantitative Strategic Asset Allocation in Python
  dev_url: https://github.com/dcajasn/Riskfolio-Lib

extra:
  recipe-maintainers:
    - timkpaine
    - zklaus

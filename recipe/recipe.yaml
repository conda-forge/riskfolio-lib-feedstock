schema_version: 1

context:
  name: Riskfolio-Lib
  version: "7.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: b02ca9d34e7e96b49e1b2a1c2bd4557894ab5f4376e4730f3bc610c6d65a806a
  patches:
    - devendor-eigen.patch

build:
  number: 0
  # VectorBT has no osx-arm64 builds for Python <3.12.
  skip: win or match(python, "<3.10") or (osx and arm64 and match(python, "<3.12"))
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy >=1.26.4
        - pybind11 >=3.1.0
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - numpy >=1.26.4
    - pybind11 >=3.1.0
    - if: match(python, ">3.10")
      then: scipy >=1.16.1
    - if: match(python, "<3.11")
      then: scipy
    - setuptools >=84.0.0
    - wheel
    - eigen
  run:
    - python
    - arch-py >=7.2
    - astropy-base >=6.1.3
    - clarabel >=0.11.1
    - cvxpy >=1.7.2
    - matplotlib-base >=3.9.2
    - networkx >=3.4.2
    - numpy >=1.26.4
    - pandas >=2.2.2
    - pybind11 >=3.1.0
    - scikit-learn >=1.7.0
    - if: match(python, ">3.10")
      then: scipy >=1.16.1
    - if: match(python, "<3.11")
      then: scipy
    - scs >=3.2.7
    - statsmodels >=0.14.5
    - vectorbt >=0.28.0
    - xlsxwriter >=3.2.2

tests:
  - python:
      imports:
        - riskfolio
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Portfolio Optimization and Quantitative Strategic Asset Allocation in Python
  homepage: https://github.com/dcajasn/Riskfolio-Lib
  repository: https://github.com/dcajasn/Riskfolio-Lib

extra:
  recipe-maintainers:
    - timkpaine
    - zklaus

schema_version: 1

context:
  name: Riskfolio-Lib
  version: "7.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') | lower }}-${{ version }}.tar.gz
  sha256: 73ab9400691e0ca4258ba1b3d4939018c67809955504807b0559904405246bdf
  patches:
    - devendor-eigen-spectra.patch

build:
  number: 1
  skip: win or match(python, "<3.9")
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy >=1.26.4
    - if: build_platform != target_platform
      then: pybind11
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - numpy >=1.26.4
    - pybind11 >=2.13.6
    - if: match(python, ">3.10")
      then: scipy >=1.16.1
    - if: match(python, "<3.11")
      then: scipy
    - setuptools >=68.1.0
    - wheel
    - eigen
    - spectra-cpp
  run:
    - python
    - arch-py >=7.2
    - astropy-base >=6.1.3
    - clarabel >=0.11.1
    - cvxpy >=1.6.6
    - matplotlib-base >=3.9.2
    - networkx >=3.4.2
    - numpy >=1.26.4
    - pandas >=2.2.2
    - scikit-learn >=1.3.0
    - if: match(python, ">3.10")
      then: scipy >=1.16.1
    - if: match(python, "<3.11")
      then: scipy
    - scs >=3.2.7
    - statsmodels >=0.14.5
    - vectorbt >=0.28.0
    - xlsxwriter >=3.2.2

tests:
  - python:
      imports:
        - riskfolio
      pip_check: false

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Portfolio Optimization and Quantitative Strategic Asset Allocation in Python
  homepage: https://github.com/dcajasn/Riskfolio-Lib
  repository: https://github.com/dcajasn/Riskfolio-Lib

extra:
  recipe-maintainers:
    - timkpaine
    - zklaus
